<nav class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 bg-gradient-to-b from-black/90 via-black/50 to-transparent px-4 sm:px-8 py-3.5 flex items-center justify-between">
    <div class="flex items-center gap-6 sm:gap-8">
        <!-- Logo & v2.0 Badge -->
        <a href="/" class="flex items-center gap-2 group">
            <span class="text-2xl sm:text-3xl font-black text-brand-500 tracking-tighter group-hover:scale-105 transition-transform duration-200 drop-shadow-md">FILVORA</span>
            <span class="bg-gradient-to-r from-red-600 to-rose-500 text-[10px] font-black text-white px-1.5 py-0.5 rounded shadow-sm ring-1 ring-white/20 tracking-wider">v2.0</span>
        </a>
        
        <!-- Desktop Navigation Links -->
        <div class="hidden md:flex items-center gap-1 text-sm font-medium">
            <a href="/" class="nav-link px-3.5 py-1.5 rounded-full text-gray-300 hover:text-white hover:bg-white/5 transition-all duration-200">Home</a>
            <a href="/discover/" class="nav-link px-3.5 py-1.5 rounded-full text-gray-300 hover:text-white hover:bg-white/5 transition-all duration-200">Discover</a>
            <a href="/movies/" class="nav-link px-3.5 py-1.5 rounded-full text-gray-300 hover:text-white hover:bg-white/5 transition-all duration-200">Movies</a>
            <a href="/series/" class="nav-link px-3.5 py-1.5 rounded-full text-gray-300 hover:text-white hover:bg-white/5 transition-all duration-200">Series</a>
            <a href="/genres/" class="nav-link px-3.5 py-1.5 rounded-full text-gray-300 hover:text-white hover:bg-white/5 transition-all duration-200">Genres</a>
            <a href="/library/" class="nav-link px-3.5 py-1.5 rounded-full text-gray-300 hover:text-white hover:bg-white/5 transition-all duration-200">My List</a>
        </div>
    </div>
    
    <!-- Right Actions -->
    <div class="flex items-center gap-3 sm:gap-5">
        <!-- Live Instant Search Bar -->
        <div class="relative" id="navbar-search-container">
            <form action="/search/" method="get" class="relative flex items-center">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                    <svg class="h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>
                <input type="text"
                       name="q"
                       placeholder="Search titles, actors..."
                       autocomplete="off"
                       hx-get="/search/suggest/"
                       hx-trigger="keyup changed delay:250ms, search"
                       hx-target="#search-results-dropdown"
                       hx-swap="innerHTML"
                       onfocus="document.getElementById('search-results-dropdown').classList.remove('hidden');"
                       class="bg-gray-900/80 border border-gray-700/80 focus:border-brand-500 rounded-full pl-10 pr-10 py-1.5 sm:py-2 text-xs sm:text-sm text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500/40 w-36 sm:w-60 md:w-68 transition-all duration-300 focus:w-52 sm:focus:w-80 shadow-inner">
                <!-- Keyboard Shortcut Hint Badge -->
                <div class="hidden sm:flex absolute inset-y-0 right-0 pr-3 items-center pointer-events-none">
                    <span class="text-[10px] text-gray-400 bg-gray-800 border border-gray-700 px-1.5 py-0.5 rounded font-mono font-bold">/</span>
                </div>
            </form>
            <!-- Suggestions Dropdown -->
            <div id="search-results-dropdown" 
                 class="absolute right-0 mt-2 w-80 sm:w-96 z-50">
            </div>
        </div>

        <!-- Shortcuts Modal Trigger Button -->
        <button onclick="toggleShortcutsModal()" title="Keyboard Shortcuts (?)" class="hidden lg:flex items-center justify-center w-8 h-8 rounded-full bg-gray-900/80 border border-gray-700/80 text-gray-300 hover:text-white hover:border-gray-500 transition shadow-sm">
            <span class="text-xs font-mono font-bold">?</span>
        </button>
        
        {% if user.is_authenticated %}
        <!-- Profile Dropdown -->
        <div class="group relative">
            <div class="h-8 w-8 sm:h-9 sm:w-9 rounded-full bg-gradient-to-tr from-brand-600 to-rose-500 p-0.5 cursor-pointer shadow-md transition-transform group-hover:scale-105">
                <img src="https://ui-avatars.com/api/?name={{ user.username }}&background=111827&color=fff&bold=true" alt="Profile" class="w-full h-full rounded-full object-cover">
            </div>
            
            <!-- Dropdown Menu -->
            <div class="absolute right-0 mt-2 w-52 bg-gray-900/95 border border-gray-800 rounded-2xl shadow-2xl backdrop-blur-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 transform origin-top-right z-50 p-2 space-y-1">
                <div class="px-3 py-2 border-b border-gray-800/80">
                    <p class="text-xs text-gray-400">Signed in as</p>
                    <p class="text-sm text-white font-bold truncate">{{ user.username }}</p>
                </div>
                <a href="/library/" class="flex items-center gap-2 px-3 py-2 text-xs font-medium text-gray-300 hover:text-white hover:bg-gray-800/80 rounded-xl transition">
                    <svg class="w-4 h-4 text-brand-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" />
                    </svg>
                    <span>My Watchlist</span>
                </a>
                <a href="/history/" class="flex items-center gap-2 px-3 py-2 text-xs font-medium text-gray-300 hover:text-white hover:bg-gray-800/80 rounded-xl transition">
                    <svg class="w-4 h-4 text-brand-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span>Watch History</span>
                </a>
                <a href="/accounts/profiles/" class="flex items-center gap-2 px-3 py-2 text-xs font-medium text-gray-300 hover:text-white hover:bg-gray-800/80 rounded-xl transition">
                    <svg class="w-4 h-4 text-brand-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                    <span>Switch Profiles</span>
                </a>
                <a href="/analytics/" class="flex items-center gap-2 px-3 py-2 text-xs font-medium text-gray-300 hover:text-white hover:bg-gray-800/80 rounded-xl transition">
                    <svg class="w-4 h-4 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                    </svg>
                    <span>Analytics & Wrapped</span>
                </a>
                <form method="post" action="/accounts/logout/">
                    {% csrf_token %}
                    <button type="submit" class="w-full flex items-center gap-2 px-3 py-2 text-xs font-medium text-red-400 hover:text-red-300 hover:bg-red-500/10 rounded-xl transition">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                        </svg>
                        <span>Sign Out</span>
                    </button>
                </form>
            </div>
        </div>
        {% else %}
        <!-- Auth Buttons -->
        <div class="flex items-center gap-2 sm:gap-3 text-xs sm:text-sm font-semibold">
            <a href="/accounts/login/" class="text-gray-300 hover:text-white px-3 py-1.5 rounded-lg hover:bg-white/5 transition">Sign In</a>
            <a href="/accounts/register/" class="bg-brand-500 hover:bg-red-600 text-white px-4 py-1.5 sm:py-2 rounded-full transition shadow-lg shadow-brand-500/30 hover:scale-105 active:scale-95 transform">Sign Up</a>
        </div>
        {% endif %}
    </div>
</nav>
