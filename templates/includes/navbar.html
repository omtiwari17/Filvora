<nav class="fixed w-full z-50 transition-all duration-300 bg-gradient-to-b from-black/80 to-transparent p-4 px-8 flex items-center justify-between">
    <div class="flex items-center gap-8">
        <!-- Logo -->
        <a href="/" class="text-3xl font-bold text-brand-500 tracking-tighter">FILVORA</a>
        
        <!-- Navigation Links -->
        <div class="hidden md:flex items-center gap-6 text-sm font-medium">
            <a href="/" class="text-white hover:text-gray-300 transition-colors">Home</a>
            <a href="/movies/" class="text-gray-300 hover:text-white transition-colors">Movies</a>
            <a href="/series/" class="text-gray-300 hover:text-white transition-colors">Series</a>
            <a href="/library/" class="text-gray-300 hover:text-white transition-colors">My List</a>
        </div>
    </div>
    
    <!-- Right Actions -->
    <div class="flex items-center gap-4 sm:gap-6">
        <!-- Live Search Bar -->
        <div class="relative" id="navbar-search-container">
            <form action="/search/" method="get" class="relative flex items-center">
                <input type="text"
                       name="q"
                       placeholder="Search movies & series..."
                       autocomplete="off"
                       hx-get="/search/suggest/"
                       hx-trigger="keyup changed delay:300ms, search"
                       hx-target="#search-results-dropdown"
                       hx-swap="innerHTML"
                       onfocus="document.getElementById('search-results-dropdown').classList.remove('hidden');"
                       class="bg-black/60 border border-gray-700/80 focus:border-brand-500 rounded-full pl-9 pr-4 py-1.5 text-xs sm:text-sm text-white placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-brand-500 w-36 sm:w-56 transition-all duration-300 focus:w-48 sm:focus:w-72">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400 absolute left-3 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </form>
            <!-- Suggestions Dropdown -->
            <div id="search-results-dropdown" 
                 class="absolute right-0 mt-2 w-80 sm:w-96 z-50">
            </div>
        </div>
        
        {% if user.is_authenticated %}
        <!-- Profile Dropdown -->
        <div class="group relative">
            <div class="h-8 w-8 rounded bg-gray-700 cursor-pointer overflow-hidden border border-gray-600 transition-colors group-hover:border-gray-400">
                <img src="https://ui-avatars.com/api/?name={{ user.username }}&background=333&color=fff" alt="Profile" class="w-full h-full object-cover">
            </div>
            
            <!-- Dropdown Menu -->
            <div class="absolute right-0 mt-2 w-48 bg-gray-900 border border-gray-800 rounded-lg shadow-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 transform origin-top-right z-50">
                <div class="py-2">
                    <div class="px-4 py-2 border-b border-gray-800">
                        <p class="text-sm text-white font-medium truncate">{{ user.username }}</p>
                    </div>
                    <a href="#" class="block px-4 py-2 text-sm text-gray-300 hover:text-white hover:bg-gray-800 transition-colors">Account Settings</a>
                    <form method="post" action="/accounts/logout/">
                        {% csrf_token %}
                        <button type="submit" class="w-full text-left block px-4 py-2 text-sm text-red-500 hover:text-red-400 hover:bg-gray-800 transition-colors">Sign Out</button>
                    </form>
                </div>
            </div>
        </div>
        {% else %}
        <!-- Auth Buttons -->
        <div class="flex items-center gap-4 text-sm font-medium">
            <a href="/accounts/login/" class="text-white hover:text-gray-300 transition-colors">Sign In</a>
            <a href="/accounts/register/" class="bg-brand-500 hover:bg-red-600 text-white px-5 py-2 rounded transition-colors shadow-lg shadow-brand-500/20">Sign Up</a>
        </div>
        {% endif %}
    </div>
</nav>
