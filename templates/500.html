{% extends 'base.html' %}

{% block title %}500 — Server Error · Filvora{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-20">
    <div class="text-center max-w-lg mx-auto space-y-6">
        <div class="relative">
            <span class="text-8xl sm:text-9xl font-black text-rose-500/20 select-none">500</span>
            <div class="absolute inset-0 flex items-center justify-center">
                <span class="text-4xl sm:text-5xl font-black text-white tracking-tight">System Glitch</span>
            </div>
        </div>
        <p class="text-sm sm:text-base text-gray-400 leading-relaxed">
            Our streaming nodes encountered an unexpected hiccup. The team has been notified.
        </p>
        <div class="flex items-center justify-center gap-3 pt-2">
            <a href="/" class="bg-brand-500 hover:bg-red-600 text-white font-bold text-sm px-6 py-3 rounded-full transition shadow-lg shadow-brand-500/20 transform hover:scale-105 active:scale-95">
                Return to Cinema Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
