{% extends 'base.html' %}

{% block title %}Sign In - Filvora{% endblock %}

{% block content %}
<div class="relative min-h-[85vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <!-- Cinematic Background -->
    <div class="absolute inset-0 z-0 overflow-hidden">
        <img src="https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?q=80&w=2070&auto=format&fit=crop" class="w-full h-full object-cover opacity-40 scale-105 transform" alt="Background">
        <div class="absolute inset-0 bg-gradient-to-t from-gray-950 via-gray-950/80 to-gray-950/40"></div>
    </div>
    
    <div class="relative z-10 w-full max-w-md p-8 sm:p-10 bg-black/60 border border-gray-800/60 rounded-2xl shadow-2xl backdrop-blur-xl">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-white tracking-tight">Sign In</h2>
            <p class="mt-2 text-sm text-gray-400">Welcome back to Filvora</p>
        </div>
        
        <form method="POST" class="space-y-6">
            {% csrf_token %}
            <div class="form-container space-y-5">
                {{ form.as_p }}
            </div>
            <button type="submit" class="w-full bg-brand-500 hover:bg-red-600 text-white font-semibold py-3.5 rounded-lg transition-all duration-200 transform hover:scale-[1.02] shadow-lg shadow-brand-500/30">
                Sign In
            </button>
        </form>
        
        <p class="mt-8 text-gray-400 text-center text-sm">
            New to Filvora? <a href="/accounts/register/" class="text-white hover:text-brand-500 transition-colors font-medium hover:underline">Sign up now</a>
        </p>
    </div>
</div>

<style>
    /* Styling for Django generated form fields */
    .form-container p {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        margin-bottom: 1.25rem;
    }
    .form-container label {
        font-size: 0.875rem;
        font-weight: 500;
        color: #d1d5db;
    }
    .form-container input {
        width: 100%;
        padding: 0.875rem 1rem;
        background-color: rgba(31, 41, 55, 0.4);
        border: 1px solid rgba(75, 85, 99, 0.4);
        border-radius: 0.5rem;
        color: white;
        font-size: 1rem;
        transition: all 0.2s;
    }
    .form-container input:focus {
        outline: none;
        border-color: #e50914;
        background-color: rgba(31, 41, 55, 0.7);
        box-shadow: 0 0 0 1px #e50914;
    }
    .form-container input::placeholder {
        color: #6b7280;
    }
    .form-container .helptext {
        font-size: 0.75rem;
        color: #9ca3af;
        margin-top: 0.25rem;
    }
    .form-container .errorlist {
        color: #ef4444;
        font-size: 0.875rem;
        list-style-type: none;
        padding: 0;
        margin-top: 0.25rem;
    }
    .form-container .errorlist li {
        display: flex;
        align-items: center;
        gap: 0.25rem;
    }
    .form-container .errorlist li::before {
        content: "•";
    }
</style>
{% endblock %}
