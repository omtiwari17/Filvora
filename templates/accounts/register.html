{% extends 'base.html' %}

{% block title %}Sign Up - Filvora v2.3{% endblock %}

{% block content %}
<div class="relative min-h-[85vh] flex items-center justify-center py-16 px-4 sm:px-6 lg:px-8">
    <!-- Cinematic Background -->
    <div class="absolute inset-0 z-0 overflow-hidden">
        <img src="https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?q=80&w=2070&auto=format&fit=crop" class="w-full h-full object-cover opacity-30 scale-105 transform animate-pulse-slow" alt="Background">
        <div class="absolute inset-0 bg-gradient-to-t from-gray-950 via-gray-950/80 to-gray-950/50"></div>
    </div>
    
    <div class="relative z-10 w-full max-w-md p-8 sm:p-10 bg-gray-950/85 border border-gray-800/90 rounded-3xl shadow-2xl backdrop-blur-2xl my-8">
        <div class="text-center mb-8 space-y-2">
            <div class="inline-flex items-center gap-2 mb-2">
                <span class="text-2xl font-black text-brand-500 tracking-tighter">FILVORA</span>
                <span class="bg-gradient-to-r from-red-600 to-rose-500 text-[10px] font-black text-white px-2 py-0.5 rounded-full ring-1 ring-white/20">v2.3</span>
            </div>
            <h2 class="text-2xl sm:text-3xl font-black text-white tracking-tight">Create Account</h2>
            <p class="text-xs text-gray-400">Join Filvora for unlimited cinema and series</p>
        </div>
        
        <form method="POST" class="space-y-5">
            {% csrf_token %}
            <div class="form-container space-y-4">
                {{ form.as_p }}
            </div>
            <button type="submit" class="w-full bg-brand-500 hover:bg-red-600 text-white font-bold py-3.5 rounded-xl transition-all duration-200 transform hover:scale-[1.02] active:scale-[0.98] shadow-lg shadow-brand-500/30 text-sm mt-4">
                Create Account
            </button>
        </form>
        
        <p class="mt-8 text-gray-400 text-center text-xs">
            Already have an account? <a href="/accounts/login/" class="text-white hover:text-brand-500 transition-colors font-bold hover:underline">Sign in here</a>
        </p>
    </div>
</div>

<style>
    /* Styling for Django generated form fields */
    .form-container p {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        margin-bottom: 0.85rem;
    }
    .form-container label {
        font-size: 0.8rem;
        font-weight: 600;
        color: #d1d5db;
    }
    .form-container input {
        width: 100%;
        padding: 0.75rem 1rem;
        background-color: rgba(17, 24, 39, 0.8);
        border: 1px solid rgba(75, 85, 99, 0.5);
        border-radius: 0.75rem;
        color: white;
        font-size: 0.9rem;
        transition: all 0.2s;
    }
    .form-container input:focus {
        outline: none;
        border-color: #e50914;
        background-color: rgba(17, 24, 39, 0.95);
        box-shadow: 0 0 0 2px rgba(229, 9, 20, 0.3);
    }
    .form-container input::placeholder {
        color: #6b7280;
    }
    .form-container .helptext {
        font-size: 0.7rem;
        color: #9ca3af;
        margin-top: 0.2rem;
        line-height: 1.3;
    }
    .form-container .errorlist {
        color: #ef4444;
        font-size: 0.8rem;
        list-style-type: none;
        padding: 0;
        margin-top: 0.25rem;
    }
    .form-container .errorlist li {
        display: flex;
        align-items: flex-start;
        gap: 0.25rem;
    }
    .form-container .errorlist li::before {
        content: "•";
        margin-top: 0.1rem;
    }
    .form-container ul {
        padding-left: 1rem;
        list-style-type: disc;
        font-size: 0.7rem;
        color: #9ca3af;
        margin-top: 0.2rem;
    }
</style>
{% endblock %}
