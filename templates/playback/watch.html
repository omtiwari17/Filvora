{% load static %}
<!DOCTYPE html>
<html lang="en" class="dark bg-black">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watching {{ title }} - Filvora</title>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#e50914',
                        }
                    }
                }
            }
        }
    </script>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script>
        document.addEventListener('htmx:configRequest', (event) => {
            event.detail.headers['X-CSRFToken'] = '{{ csrf_token }}';
        });
    </script>
    
    <!-- Video.js Base CSS (Local) -->
    <link href="{% static 'css/videojs/video-js.css' %}" rel="stylesheet" />
    <link href="{% static 'css/videojs/theme-fantasy.css' %}" rel="stylesheet" />
    
    <style>
        .video-js {
            font-family: inherit !important;
        }
        .vjs-theme-fantasy .vjs-control-bar {
            background: rgba(0, 0, 0, 0.85) !important;
            border-radius: 12px !important;
            bottom: 20px !important;
            left: 2% !important;
            width: 96% !important;
            height: 50px !important;
            padding: 0 15px !important;
            display: flex !important;
            align-items: center !important;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5) !important;
        }
    </style>
</head>
<body class="bg-black text-white h-screen w-screen overflow-hidden flex flex-col relative select-none font-sans">

    <!-- Top Overlay (Title, Controls & Server Switcher) -->
    <div id="player-overlay" class="absolute top-0 left-0 w-full p-4 sm:p-6 z-50 flex items-center justify-between bg-gradient-to-b from-black/95 via-black/70 to-transparent transition-opacity duration-500">
        <div class="flex items-center gap-3 sm:gap-5">
            <a href="{% if media_type == 'movie' %}/movies/{{ tmdb_id }}/{% else %}/series/{{ tmdb_id }}/{% endif %}" 
               class="text-white hover:text-brand-500 transition p-2.5 rounded-full bg-black/60 backdrop-blur-xl border border-gray-700/60 shadow-lg hover:scale-105 active:scale-95"
               title="Back to Details">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
            </a>
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="text-base sm:text-xl md:text-2xl font-black drop-shadow text-white truncate max-w-[200px] sm:max-w-md md:max-w-lg">{{ title }}</h1>
                    <span class="hidden sm:inline-block bg-brand-500/20 border border-brand-500/40 text-brand-500 text-[10px] font-black px-1.5 py-0.5 rounded">v2.0</span>
                </div>
                <p class="text-[11px] sm:text-xs text-gray-400 flex items-center gap-1.5 mt-0.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                    <span>Streaming via Server {{ current_server|upper }}</span>
                </p>
            </div>
        </div>
        
        <div class="flex items-center gap-2 sm:gap-3">
            <!-- Server Switcher Dropdown -->
            <div class="relative flex items-center">
                <select onchange="window.location.replace('?server=' + this.value)" 
                        class="bg-gray-900/90 text-xs text-gray-200 border border-gray-700/80 rounded-xl px-3 py-2 focus:outline-none focus:border-brand-500 cursor-pointer backdrop-blur-xl shadow-lg">
                    {% for p in providers %}
                    <option value="{{ p.id }}" {% if p.id == current_server %}selected{% endif %}>
                        ⚡ Server {{ p.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Next Episode Button (For TV Series) -->
            {% if next_episode %}
            <a href="{{ next_episode.url }}{% if current_server %}?server={{ current_server }}{% endif %}" 
               class="inline-flex items-center gap-1.5 bg-brand-500 hover:bg-red-600 text-white text-xs font-bold px-3.5 py-2 rounded-xl transition shadow-lg shadow-brand-500/25 hover:scale-105 active:scale-95">
                <span>Next (E{{ next_episode.episode }})</span>
                <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
                </svg>
            </a>
            {% endif %}

            <!-- My List Button -->
            <button hx-post="/library/toggle/" 
                    hx-vals='{"tmdb_id": "{{ tmdb_id }}", "media_type": "{{ media_type }}"}' 
                    hx-swap="outerHTML"
                    class="bg-gray-900/90 hover:bg-gray-800 text-white px-3.5 py-2 rounded-xl font-bold transition backdrop-blur-xl text-xs border border-gray-700/80 flex items-center gap-1.5 shadow-lg hover:scale-105 active:scale-95">
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
                </svg>
                <span class="hidden sm:inline">My List</span>
            </button>
        </div>
    </div>

    <!-- Active Video Player Container -->
    <div class="absolute inset-0 w-full h-full bg-black z-0">
        {% if ".m3u8" in video_url or ".mp4" in video_url %}
        <!-- Direct HLS / MP4 Stream (Local Video.js) -->
        <video-js
            id="filvora-player"
            class="video-js vjs-fill vjs-theme-fantasy"
            controls
            preload="auto"
            autoplay
            data-setup='{"fill": true, "controlBar": {"skipButtons": {"forward": 10, "backward": 10}}}'
        >
            <source src="{{ video_url }}" type="application/x-mpegURL">
        </video-js>
        {% else %}
        <!-- Dynamic Authorized Movie/Episode Provider Embed -->
        <iframe
            id="filvora-embed-frame"
            src="{{ video_url }}"
            class="w-full h-full border-0 absolute inset-0 bg-black"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
            allowfullscreen
            referrerpolicy="origin"
        ></iframe>
        {% endif %}
    </div>

    <!-- Video.js Core Script (Local) -->
    <script src="{% static 'js/videojs/video.min.js' %}"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const overlay = document.getElementById('player-overlay');
            const videoEl = document.getElementById('filvora-player');
            
            let timeout;
            const resetTimer = () => {
                if (overlay) overlay.style.opacity = '1';
                clearTimeout(timeout);
                timeout = setTimeout(() => {
                    if (overlay) {
                        overlay.style.opacity = '0';
                    }
                }, 3500);
            };

            document.addEventListener('mousemove', resetTimer);
            document.addEventListener('touchstart', resetTimer);
            resetTimer();

            // Progress tracking
            const csrfToken = '{{ csrf_token }}';
            const tmdbId = {{ tmdb_id }};
            const mediaType = '{{ media_type }}';
            const seasonNum = {% if season %}{{ season }}{% else %}null{% endif %};
            const episodeNum = {% if episode %}{{ episode }}{% else %}null{% endif %};

            let watchSeconds = 0;
            setInterval(() => {
                watchSeconds += 10;
                // Periodic beacon
                const payload = JSON.stringify({
                    tmdb_id: tmdbId,
                    media_type: mediaType,
                    position: watchSeconds,
                    duration: 7200, // standard duration estimated for embed
                    season: seasonNum,
                    episode: episodeNum
                });

                if (navigator.sendBeacon) {
                    const blob = new Blob([payload], { type: 'application/json' });
                    navigator.sendBeacon('/progress/save/', blob);
                }
            }, 15000);

            // If Video.js is active on this page
            if (videoEl && typeof videojs !== 'undefined') {
                const player = videojs('filvora-player');
                const initialResumePosition = {{ resume_position|default:0 }};
                
                player.ready(() => {
                    if (initialResumePosition > 0) {
                        player.currentTime(initialResumePosition);
                    }
                    const p = player.play();
                    if (p !== undefined) p.catch(() => {});
                });

                // Global Keyboard Shortcuts
                document.addEventListener('keydown', (e) => {
                    const active = document.activeElement;
                    if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;
                    
                    const key = e.key ? e.key.toLowerCase() : '';
                    if (key === ' ' || key === 'k') {
                        e.preventDefault();
                        player.paused() ? player.play() : player.pause();
                    } else if (key === 'f') {
                        e.preventDefault();
                        player.isFullscreen() ? player.exitFullscreen() : player.requestFullscreen();
                    } else if (key === 'm') {
                        e.preventDefault();
                        player.muted(!player.muted());
                    } else if (key === 'arrowright' || key === 'l') {
                        e.preventDefault();
                        player.currentTime(Math.min(player.duration() || 99999, player.currentTime() + 10));
                    } else if (key === 'arrowleft' || key === 'j') {
                        e.preventDefault();
                        player.currentTime(Math.max(0, player.currentTime() - 10));
                    }
                }, true);
            }
        });
    </script>
</body>
</html>
