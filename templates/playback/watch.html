{% load static %}
<!DOCTYPE html>
<html lang="en" class="dark bg-black">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watching {{ title }} - Filvora</title>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Video.js Base CSS (Local) -->
    <link href="{% static 'css/videojs/video-js.css' %}" rel="stylesheet" />
    
    <!-- Video.js Themes -->
    <link href="{% static 'css/videojs/theme-fantasy.css' %}" rel="stylesheet" />
    
    <style>
        /* Custom Modern Player Theme (Matching Screenshot) */
        .video-js {
            font-family: inherit !important;
            border-radius: 12px;
            overflow: hidden;
        }
        
        /* The Big Play Button */
        .video-js .vjs-big-play-button {
            background-color: rgba(0, 0, 0, 0.5) !important;
            border: 2px solid white !important;
            border-radius: 50% !important;
            width: 80px !important;
            height: 80px !important;
            line-height: 76px !important;
            left: 50% !important;
            top: 50% !important;
            transform: translate(-50%, -50%) !important;
            transition: all 0.3s ease !important;
        }
        .video-js:hover .vjs-big-play-button {
            background-color: rgba(229, 9, 20, 0.9) !important;
            border-color: transparent !important;
            transform: translate(-50%, -50%) scale(1.1) !important;
        }

        /* Floating Pill Control Bar */
        .vjs-theme-fantasy .vjs-control-bar {
            background: rgba(0, 0, 0, 0.85) !important;
            border-radius: 12px !important;
            bottom: 20px !important;
            left: 2% !important;
            width: 96% !important;
            height: 50px !important;
            padding: 0 15px !important;
            display: flex !important;
            align-items: center !important;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5) !important;
        }
        
        /* Adjust progress bar for the pill theme */
        .vjs-theme-fantasy .vjs-progress-control {
            display: flex !important;
            align-items: center !important;
        }
    </style>
</head>
<body class="bg-black text-white h-screen w-screen overflow-hidden flex flex-col">

    <!-- Top Overlay (Title & Back Button) -->
    <div id="player-overlay" class="absolute top-0 left-0 w-full p-8 z-50 flex items-center justify-between bg-gradient-to-b from-black/90 to-transparent transition-opacity duration-500">
        <div class="flex items-center gap-6">
            <a href="javascript:history.back()" class="text-white hover:text-brand-500 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
            </a>
            <h1 class="text-2xl font-bold drop-shadow">{{ title }}</h1>
        </div>
        
        <button hx-post="/library/toggle/" 
                hx-vals='{"tmdb_id": "{{ tmdb_id }}", "media_type": "{{ media_type }}"}' 
                hx-swap="none"
                class="bg-gray-800/80 hover:bg-gray-700 text-white px-4 py-2 rounded-full font-medium transition backdrop-blur-sm text-sm border border-gray-600">
            + My List
        </button>
    </div>

    <!-- Video.js Player -->
    <div class="absolute inset-0 w-full h-full bg-black">
        <video-js
            id="filvora-player"
            class="video-js vjs-fill vjs-theme-fantasy"
            controls
            preload="auto"
            autoplay
            data-setup='{"fill": true, "controlBar": {"skipButtons": {"forward": 10, "backward": 10}}}'
        >
            <source src="{{ video_url }}" type="application/x-mpegURL">
            <p class="vjs-no-js">
                To view this video please enable JavaScript, and consider upgrading to a web browser that supports HTML5 video
            </p>
        </video-js>
    </div>

    <!-- Video.js Core Script (Local) -->
    <script src="{% static 'js/videojs/video.min.js' %}"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const player = videojs('filvora-player');
            const overlay = document.getElementById('player-overlay');
            
            let timeout;
            
            // Fade out the overlay when inactive
            const resetTimer = () => {
                if (overlay) overlay.style.opacity = '1';
                clearTimeout(timeout);
                timeout = setTimeout(() => {
                    if (player && !player.paused() && overlay) {
                        overlay.style.opacity = '0';
                    }
                }, 3000);
            };

            document.addEventListener('mousemove', resetTimer);
            
            player.ready(() => {
                player.on('pause', () => {
                    if (overlay) overlay.style.opacity = '1';
                });
                player.on('play', resetTimer);
                
                // Auto play with promise catch
                const p = player.play();
                if (p !== undefined) {
                    p.catch(() => { /* Autoplay blocked by browser policy */ });
                }
            });

            // Resume playback if user has previous progress
            const initialResumePosition = {{ resume_position|default:0 }};
            if (initialResumePosition > 0) {
                player.one('loadedmetadata', () => {
                    player.currentTime(initialResumePosition);
                });
            }

            const csrfToken = '{{ csrf_token }}';
            const tmdbId = {{ tmdb_id }};
            const mediaType = '{{ media_type }}';
            const seasonNum = {% if season %}{{ season }}{% else %}null{% endif %};
            const episodeNum = {% if episode %}{{ episode }}{% else %}null{% endif %};

            const sendProgress = (isBeacon = false) => {
                if (!player) return;
                const position = player.currentTime();
                const duration = player.duration();
                if (!position || isNaN(position) || position < 1) return;

                const payload = JSON.stringify({
                    tmdb_id: tmdbId,
                    media_type: mediaType,
                    position: position,
                    duration: isNaN(duration) ? 0 : duration,
                    season: seasonNum,
                    episode: episodeNum
                });

                if (isBeacon && navigator.sendBeacon) {
                    const blob = new Blob([payload], { type: 'application/json' });
                    navigator.sendBeacon('/progress/save/', blob);
                } else {
                    fetch('/progress/save/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': csrfToken
                        },
                        body: payload,
                        keepalive: true
                    }).catch(() => {});
                }
            };

            // Periodically send progress every 10 seconds while playing
            setInterval(() => {
                if (player && !player.paused()) {
                    sendProgress();
                }
            }, 10000);

            player.on('pause', () => sendProgress());
            window.addEventListener('beforeunload', () => sendProgress(true));
            window.addEventListener('pagehide', () => sendProgress(true));

            // Global Keyboard Shortcuts
            document.addEventListener('keydown', (e) => {
                // Ignore if user is focused on an input element
                const active = document.activeElement;
                if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable)) {
                    return;
                }
                
                const key = e.key ? e.key.toLowerCase() : '';
                const code = e.code || '';

                if (key === ' ' || code === 'Space' || key === 'k' || code === 'KeyK') {
                    e.preventDefault();
                    if (player.paused()) {
                        player.play();
                    } else {
                        player.pause();
                    }
                } else if (key === 'f' || code === 'KeyF') {
                    e.preventDefault();
                    if (player.isFullscreen()) {
                        player.exitFullscreen();
                    } else {
                        player.requestFullscreen();
                    }
                } else if (key === 'm' || code === 'KeyM') {
                    e.preventDefault();
                    player.muted(!player.muted());
                } else if (key === 'arrowright' || code === 'ArrowRight' || key === 'l' || code === 'KeyL') {
                    e.preventDefault();
                    const cur = player.currentTime() || 0;
                    const dur = player.duration() || 999999;
                    player.currentTime(Math.min(dur, cur + 10));
                } else if (key === 'arrowleft' || code === 'ArrowLeft' || key === 'j' || code === 'KeyJ') {
                    e.preventDefault();
                    const cur = player.currentTime() || 0;
                    player.currentTime(Math.max(0, cur - 10));
                } else if (key === 'arrowup' || code === 'ArrowUp') {
                    e.preventDefault();
                    const vol = player.volume();
                    player.volume(Math.min(1, vol + 0.1));
                } else if (key === 'arrowdown' || code === 'ArrowDown') {
                    e.preventDefault();
                    const vol = player.volume();
                    player.volume(Math.max(0, vol - 0.1));
                }
            }, true);
        });
    </script>
</body>
</html>
