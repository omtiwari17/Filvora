{% if is_watched %}
<button id="card-watch-btn-{{ media_type }}-{{ tmdb_id }}"
        hx-post="/progress/mark-watched/"
        hx-vals='{"tmdb_id": "{{ tmdb_id }}", "media_type": "{{ media_type }}", "variant": "card"}'
        hx-target="this"
        hx-swap="outerHTML"
        onclick="event.preventDefault(); event.stopPropagation();"
        title="Watched (Click to unmark)"
        class="w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-emerald-600 hover:bg-emerald-500 text-white flex items-center justify-center shadow-lg shadow-emerald-600/30 ring-1 ring-emerald-400/50 transition-all duration-200 transform hover:scale-110 active:scale-95 shrink-0">
    <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 fill-current" viewBox="0 0 24 24">
        <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
    </svg>
</button>
{% else %}
<button id="card-watch-btn-{{ media_type }}-{{ tmdb_id }}"
        hx-post="/progress/mark-watched/"
        hx-vals='{"tmdb_id": "{{ tmdb_id }}", "media_type": "{{ media_type }}", "variant": "card"}'
        hx-target="this"
        hx-swap="outerHTML"
        onclick="event.preventDefault(); event.stopPropagation();"
        title="Mark as Watched"
        class="w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-gray-900/90 hover:bg-emerald-950/40 hover:border-emerald-500/60 text-gray-400 hover:text-emerald-400 border border-gray-700/80 flex items-center justify-center shadow-lg transition-all duration-200 transform hover:scale-110 active:scale-95 shrink-0">
    <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
    </svg>
</button>
{% endif %}
