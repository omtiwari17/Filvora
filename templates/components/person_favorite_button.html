<button id="person-fav-btn-{{ person.id }}"
        hx-post="/library/person/toggle/"
        hx-vals='{"person_id": "{{ person.id }}", "name": "{{ person.name|escapejs }}", "profile_path": "{{ person.profile_path|default:""|escapejs }}", "known_for_department": "{{ person.known_for_department|default:"Acting"|escapejs }}"}'
        hx-target="#person-fav-btn-{{ person.id }}"
        hx-swap="outerHTML"
        title="{% if is_favorite %}Remove from Favorites{% else %}Add to Favorites{% endif %}"
        class="{% if is_favorite %}bg-rose-500/20 hover:bg-rose-500/30 text-rose-400 border border-rose-500/40 ring-1 ring-rose-500/30 shadow-lg shadow-rose-500/10{% else %}bg-gray-900/90 hover:bg-gray-800 text-gray-300 hover:text-white border border-gray-700/80 hover:border-gray-600 shadow-lg{% endif %} px-4 py-2 rounded-full font-bold text-xs sm:text-sm flex items-center justify-center gap-2 transition backdrop-blur-md transform hover:scale-105 active:scale-95 cursor-pointer">
    {% if is_favorite %}
    <svg class="w-4 h-4 text-rose-500 fill-current shrink-0" viewBox="0 0 24 24">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </svg>
    <span>Favorited</span>
    {% else %}
    <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
    </svg>
    <span>Favorite {% if person.known_for_department == 'Directing' %}Director{% elif person.known_for_department == 'Writing' %}Writer{% else %}Actor{% endif %}</span>
    {% endif %}
</button>
