<button id="detail-watch-btn-{{ tmdb_id }}"
        hx-post="/progress/mark-watched/"
        hx-vals='{"tmdb_id": "{{ tmdb_id }}", "media_type": "{{ media_type }}", "variant": "detail"}'
        hx-target="#detail-watch-btn-{{ tmdb_id }}"
        hx-swap="outerHTML"
        class="{% if is_watched %}bg-emerald-600 hover:bg-emerald-500 text-white shadow-emerald-600/30 ring-1 ring-emerald-400/40{% else %}bg-gray-900/90 hover:bg-gray-800 text-white border border-gray-700{% endif %} px-6 py-3.5 rounded-full font-bold text-sm sm:text-base flex items-center justify-center gap-2 transition shadow-lg backdrop-blur-md transform hover:scale-105 active:scale-95">
    {% if is_watched %}
    <svg class="h-5 w-5 fill-current" viewBox="0 0 24 24">
        <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
    </svg>
    <span>Watched</span>
    {% else %}
    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
    </svg>
    <span>Mark as Watched</span>
    {% endif %}
</button>
