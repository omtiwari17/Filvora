<div id="card-rate-{{ media_type }}-{{ tmdb_id }}" class="relative quick-rate-wrapper shrink-0" onclick="event.stopPropagation();">
    {% if current_rating and current_rating > 0 %}
    <!-- Rated Trigger Button -->
    <button type="button"
            onclick="event.preventDefault(); event.stopPropagation(); toggleCardRate('card-rate-{{ media_type }}-{{ tmdb_id }}');"
            title="Your rating: {{ current_rating }}/5 (Click to change)"
            class="w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-yellow-500/20 hover:bg-yellow-500/30 text-yellow-400 border border-yellow-500/60 shadow-lg shadow-yellow-500/10 ring-1 ring-yellow-400/40 flex items-center justify-center gap-0.5 transition-all duration-200 transform hover:scale-110 active:scale-95">
        <svg class="w-3 h-3 sm:w-3.5 sm:h-3.5 fill-current" viewBox="0 0 20 20">
            <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
        </svg>
        <span class="text-[9px] font-black leading-none">{{ current_rating }}</span>
    </button>
    {% else %}
    <!-- Unrated Trigger Button -->
    <button type="button"
            onclick="event.preventDefault(); event.stopPropagation(); toggleCardRate('card-rate-{{ media_type }}-{{ tmdb_id }}');"
            title="Rate with stars"
            class="w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-gray-900/90 hover:bg-yellow-950/40 hover:border-yellow-500/60 text-gray-400 hover:text-yellow-400 border border-gray-700/80 flex items-center justify-center shadow-lg transition-all duration-200 transform hover:scale-110 active:scale-95">
        <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 fill-current" viewBox="0 0 20 20">
            <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
        </svg>
    </button>
    {% endif %}

    <!-- Micro Star Popover Capsule -->
    <div class="quick-rate-popover hidden absolute bottom-9 sm:bottom-10 -right-10 sm:-right-8 z-50 bg-gray-950/95 backdrop-blur-xl border border-gray-700/90 rounded-xl p-1.5 shadow-2xl flex items-center gap-0.5 ring-1 ring-white/10 shrink-0 whitespace-nowrap min-w-max"
         data-score="{{ current_rating|default:0 }}"
         onmouseleave="resetCardStars(this);"
         onclick="event.stopPropagation();">
        {% for star in "12345" %}
        <button type="button"
                hx-post="/progress/rate/"
                hx-vals='{"tmdb_id": "{{ tmdb_id }}", "media_type": "{{ media_type }}", "score": "{{ star }}", "variant": "card"}'
                hx-target="#card-rate-{{ media_type }}-{{ tmdb_id }}"
                hx-swap="outerHTML"
                onclick="event.stopPropagation();"
                onmouseenter="previewCardStars(this, {{ star }});"
                title="Rate {{ star }} star{% if star != '1' %}s{% endif %}"
                class="star-opt w-7 h-7 flex items-center justify-center shrink-0 rounded-lg p-1 transition-colors duration-150 transform hover:scale-125 active:scale-95 {% if current_rating >= star|add:'0' %}text-yellow-400{% else %}text-gray-500 hover:text-yellow-400{% endif %}">
            <svg width="18" height="18" class="w-4.5 h-4.5 sm:w-5 sm:h-5 fill-current shrink-0 pointer-events-none drop-shadow-sm" viewBox="0 0 20 20">
                <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
            </svg>
        </button>
        {% endfor %}
        {% if current_rating and current_rating > 0 %}
        <div class="h-4 w-px bg-gray-700 mx-0.5"></div>
        <button type="button"
                hx-post="/progress/rate/remove/"
                hx-vals='{"tmdb_id": "{{ tmdb_id }}", "media_type": "{{ media_type }}", "variant": "card"}'
                hx-target="#card-rate-{{ media_type }}-{{ tmdb_id }}"
                hx-swap="outerHTML"
                onclick="event.stopPropagation();"
                title="Remove rating"
                class="w-7 h-7 flex items-center justify-center shrink-0 rounded-lg p-1 text-gray-500 hover:text-red-400 hover:bg-red-500/10 transition-colors transform hover:scale-110">
            <svg width="16" height="16" class="w-3.5 h-3.5 shrink-0 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/>
            </svg>
        </button>
        {% endif %}
    </div>
</div>
