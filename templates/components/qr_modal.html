<!-- Modal: QR Code Mobile / TV Pairing -->
{% if lan_access_url %}
<div id="qr-pairing-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4">
    <div class="bg-gray-900 border border-gray-800 rounded-3xl p-6 sm:p-8 max-w-xs w-full shadow-2xl space-y-5 text-center">
        <div class="flex items-center justify-between">
            <h3 class="text-lg font-black text-white">Scan to Watch</h3>
            <button type="button" onclick="document.getElementById('qr-pairing-modal').classList.add('hidden')" class="text-gray-400 hover:text-white">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
        
        <div class="bg-white p-3.5 rounded-2xl inline-block shadow-inner mx-auto">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data={{ lan_access_url }}" alt="Scan QR Code" class="w-44 h-44 rounded-lg">
        </div>

        <div>
            <p class="text-xs font-bold text-white mb-0.5">Connect from Phone or TV</p>
            <p class="text-[11px] text-gray-400">Point your camera to instantly open Filvora on your local network</p>
        </div>

        <div class="pt-1">
            <button type="button" onclick="document.getElementById('qr-pairing-modal').classList.add('hidden')" class="w-full py-2.5 bg-gray-800 hover:bg-gray-700 text-white rounded-xl font-bold text-xs transition border border-gray-700">
                Close
            </button>
        </div>
    </div>
</div>
{% endif %}
