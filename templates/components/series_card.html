{% load static %}
<div class="flex-none w-36 sm:w-44 md:w-48 transform transition-all duration-300 hover:scale-105 hover:z-30 cursor-pointer snap-start group/card flex flex-col">
    <div class="aspect-[2/3] rounded-2xl overflow-hidden shadow-xl bg-gray-900 ring-1 ring-gray-800 relative group-hover/card:ring-2 group-hover/card:ring-brand-500/80 group-hover/card:shadow-2xl group-hover/card:shadow-brand-500/20 transition-all duration-300">
        {% if series.poster_path %}
        <img src="{% if series.poster_path|slice:':8' == '/static/' or series.poster_path|slice:':4' == 'http' %}{{ series.poster_path }}{% else %}https://image.tmdb.org/t/p/w500{{ series.poster_path }}{% endif %}" 
             alt="{{ series.name }}" 
             loading="lazy" 
             class="w-full h-full object-cover transition-transform duration-300 group-hover/card:scale-105">
        {% else %}
        <div class="w-full h-full bg-gradient-to-br from-gray-900 to-gray-800 flex items-center justify-center p-3 text-center text-gray-500 font-bold text-xs">
            {{ series.name }}
        </div>
        {% endif %}
        
        <!-- Hover Overlay with Actions -->
        <div class="absolute inset-0 bg-gradient-to-t from-gray-950 via-gray-950/60 to-black/30 opacity-0 group-hover/card:opacity-100 transition-opacity duration-300 flex flex-col justify-between p-3.5">
            <!-- Top Badges Row -->
            <div class="flex items-center justify-between gap-1 z-20">
                <span class="flex items-center gap-1 bg-black/80 backdrop-blur-md px-2 py-0.5 rounded text-[10px] font-black text-yellow-400 border border-yellow-500/30 shadow">
                    <svg class="w-3 h-3 fill-yellow-400" viewBox="0 0 20 20">
                        <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                    </svg>
                    {{ series.vote_average|floatformat:1 }}
                </span>
                <span class="text-[9px] font-black px-1.5 py-0.5 rounded bg-black/80 backdrop-blur-md text-gray-300 border border-gray-700">
                    {{ series.age_rating|default:'TV-MA' }}
                </span>
            </div>

            <!-- Center Action: Direct Play Button (Episode 1) -->
            <div class="flex items-center justify-center z-20 my-auto">
                <a href="/watch/tv/{{ series.id }}/1/1/" 
                   class="w-12 h-12 rounded-full bg-brand-500 hover:bg-red-600 text-white flex items-center justify-center shadow-2xl shadow-brand-500/50 hover:scale-110 active:scale-95 transition-transform"
                   title="Play S1:E1">
                    <svg class="w-5 h-5 fill-white translate-x-0.5" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                </a>
            </div>

            <!-- Bottom Action Row -->
            <div class="flex items-center justify-between gap-1 z-20 pt-1 border-t border-gray-800/80">
                <!-- My List Toggle -->
                {% if series.id in user_saved_ids %}
                <button hx-post="/library/toggle/" 
                        hx-vals='{"tmdb_id": "{{ series.id }}", "media_type": "tv", "variant": "card"}' 
                        hx-swap="outerHTML"
                        onclick="event.preventDefault(); event.stopPropagation();"
                        title="Saved in My List"
                        class="w-8 h-8 rounded-full bg-brand-500 hover:bg-red-600 text-white flex items-center justify-center shadow-lg transition-transform hover:scale-110">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
                    </svg>
                </button>
                {% else %}
                <button hx-post="/library/toggle/" 
                        hx-vals='{"tmdb_id": "{{ series.id }}", "media_type": "tv", "variant": "card"}' 
                        hx-swap="outerHTML"
                        onclick="event.preventDefault(); event.stopPropagation();"
                        title="Add to My List"
                        class="w-8 h-8 rounded-full bg-gray-900/90 hover:bg-gray-800 text-white border border-gray-700 flex items-center justify-center shadow-lg transition-transform hover:scale-110">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
                    </svg>
                </button>
                {% endif %}

                <!-- Info Details Link -->
                <a href="/series/{{ series.id }}/" 
                   onclick="event.stopPropagation();"
                   title="View Series Details"
                   class="w-8 h-8 rounded-full bg-black/70 hover:bg-gray-800 text-gray-300 hover:text-white border border-gray-700/80 flex items-center justify-center shadow-lg transition-transform hover:scale-110">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </a>
            </div>
        </div>
    </div>
    <div class="mt-2.5 px-0.5">
        <a href="/series/{{ series.id }}/" class="text-xs sm:text-sm font-bold text-gray-200 group-hover/card:text-brand-500 transition line-clamp-1 block">
            {{ series.name }}
        </a>
        <div class="flex items-center gap-1.5 text-[11px] text-gray-400 mt-0.5">
            <span>{{ series.first_air_date|slice:":4" }}</span>
            <span>•</span>
            <span class="text-[10px] font-semibold text-gray-500">Series</span>
        </div>
    </div>
</div>
