<!-- 🎬 Filvora Cinematic Official Trailer Modal (Zero-Emoji, Strict SVG, Instant Audio Cutoff) -->
<div id="trailer-modal" 
     class="fixed inset-0 z-[100] bg-black/90 backdrop-blur-2xl hidden flex items-center justify-center p-3 sm:p-6 transition-all duration-300 opacity-0 pointer-events-none"
     role="dialog" 
     aria-modal="true"
     aria-labelledby="trailer-modal-title">

    <div class="relative w-full max-w-5xl bg-gray-950 border border-gray-800/90 rounded-3xl shadow-2xl overflow-hidden flex flex-col transform scale-95 transition-all duration-300" id="trailer-modal-dialog">
        <!-- Modal Top Bar -->
        <div class="flex items-center justify-between px-5 py-3.5 border-b border-gray-800/80 bg-gray-900/80">
            <div class="flex items-center gap-3 min-w-0 pr-4">
                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-brand-500/20 border border-brand-500/40 text-brand-400 text-[11px] font-black tracking-wider uppercase shrink-0">
                    <svg class="w-3 h-3 fill-brand-400 translate-x-0.5" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    Official Trailer
                </span>
                <h3 id="trailer-modal-title" class="text-sm sm:text-base font-bold text-white truncate drop-shadow"></h3>
            </div>
            
            <div class="flex items-center gap-3 shrink-0">
                <span class="hidden sm:inline text-[10px] text-gray-500 font-mono bg-gray-900 px-2 py-0.5 rounded border border-gray-800">ESC to close</span>
                <button type="button" 
                        onclick="closeTrailerModal()" 
                        aria-label="Close trailer"
                        class="w-8 h-8 rounded-full bg-gray-900 hover:bg-gray-800 text-gray-400 hover:text-white border border-gray-700/80 hover:border-gray-500 transition flex items-center justify-center shadow focus:outline-none">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- 16:9 Cinema Container -->
        <div class="relative w-full aspect-video bg-black flex items-center justify-center">
            <!-- Loading Indicator -->
            <div id="trailer-loader" class="absolute inset-0 flex flex-col items-center justify-center gap-3 bg-gray-950 z-10 hidden">
                <div class="w-10 h-10 border-3 border-brand-500 border-t-transparent rounded-full animate-spin"></div>
                <p class="text-xs font-semibold text-gray-400">Loading official trailer...</p>
            </div>

            <!-- YouTube Video Iframe -->
            <iframe id="trailer-iframe" 
                    class="w-full h-full" 
                    src="" 
                    title="Official Trailer" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    allowfullscreen>
            </iframe>
        </div>
    </div>
</div>

<script>
    function openTrailerModal(youtubeKey, title) {
        if (!youtubeKey) return;
        const modal = document.getElementById('trailer-modal');
        const dialog = document.getElementById('trailer-modal-dialog');
        const iframe = document.getElementById('trailer-iframe');
        const titleEl = document.getElementById('trailer-modal-title');
        const loader = document.getElementById('trailer-loader');
        if (!modal || !iframe) return;

        if (titleEl) titleEl.textContent = title || 'Official Trailer';
        if (loader) loader.classList.add('hidden');

        // Fast YouTube embed without cookies and with autoplay
        iframe.src = "https://www.youtube-nocookie.com/embed/" + youtubeKey + "?autoplay=1&rel=0&modestbranding=1&enablejsapi=1";

        modal.classList.remove('hidden', 'pointer-events-none');
        document.body.classList.add('overflow-hidden');
        requestAnimationFrame(() => {
            modal.classList.remove('opacity-0');
            if (dialog) {
                dialog.classList.remove('scale-95');
                dialog.classList.add('scale-100');
            }
        });
    }

    function openTrailerFor(mediaType, tmdbId, title) {
        const modal = document.getElementById('trailer-modal');
        const dialog = document.getElementById('trailer-modal-dialog');
        const iframe = document.getElementById('trailer-iframe');
        const titleEl = document.getElementById('trailer-modal-title');
        const loader = document.getElementById('trailer-loader');
        if (!modal || !iframe) return;

        if (titleEl) titleEl.textContent = title || 'Official Trailer';
        if (loader) loader.classList.remove('hidden');
        iframe.src = '';

        modal.classList.remove('hidden', 'pointer-events-none');
        document.body.classList.add('overflow-hidden');
        requestAnimationFrame(() => {
            modal.classList.remove('opacity-0');
            if (dialog) {
                dialog.classList.remove('scale-95');
                dialog.classList.add('scale-100');
            }
        });

        fetch("/trailer/" + mediaType + "/" + tmdbId + "/")
            .then(res => res.json())
            .then(data => {
                if (data && data.trailer_key) {
                    if (loader) loader.classList.add('hidden');
                    iframe.src = "https://www.youtube-nocookie.com/embed/" + data.trailer_key + "?autoplay=1&rel=0&modestbranding=1&enablejsapi=1";
                } else {
                    if (loader) {
                        loader.innerHTML = '<div class=\"text-center space-y-2 p-6\"><p class=\"text-sm font-bold text-white\">Trailer Unavailable</p><p class=\"text-xs text-gray-400\">An official trailer is not currently available for this title.</p></div>';
                    }
                }
            })
            .catch(() => {
                if (loader) {
                    loader.innerHTML = '<p class=\"text-xs text-red-400\">Unable to load trailer at this time.</p>';
                }
            });
    }

    function closeTrailerModal() {
        const modal = document.getElementById('trailer-modal');
        const dialog = document.getElementById('trailer-modal-dialog');
        const iframe = document.getElementById('trailer-iframe');
        if (!modal || !iframe) return;

        modal.classList.add('opacity-0');
        if (dialog) {
            dialog.classList.remove('scale-100');
            dialog.classList.add('scale-95');
        }
        document.body.classList.remove('overflow-hidden');

        setTimeout(() => {
            iframe.src = ''; // Stops audio and streaming immediately
            modal.classList.add('hidden', 'pointer-events-none');
            const loader = document.getElementById('trailer-loader');
            if (loader) {
                loader.innerHTML = '<div class=\"w-10 h-10 border-3 border-brand-500 border-t-transparent rounded-full animate-spin\"></div><p class=\"text-xs font-semibold text-gray-400\">Loading official trailer...</p>';
                loader.classList.add('hidden');
            }
        }, 220);
    }

    // Global Keydown Handler: Escape to close
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            const modal = document.getElementById('trailer-modal');
            if (modal && !modal.classList.contains('hidden')) {
                closeTrailerModal();
            }
        }
    });

    // Backdrop click dismiss
    document.addEventListener('click', function(e) {
        const modal = document.getElementById('trailer-modal');
        if (modal && !modal.classList.contains('hidden') && e.target === modal) {
            closeTrailerModal();
        }
    });
</script>
