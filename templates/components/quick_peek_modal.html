<!-- 🎬 Filvora Spacebar Quick Peek Modal (Zero-Emoji, Strict Lucide SVG, Apple TV+ Specular Depth) -->
<div id="quick-peek-backdrop"
     onclick="closeQuickPeekModal()"
     class="hidden fixed inset-0 z-[90] bg-black/80 backdrop-blur-md opacity-0 transition-opacity duration-200"></div>

<div id="quick-peek-modal"
     role="dialog"
     aria-modal="true"
     aria-labelledby="quick-peek-title"
     class="hidden fixed inset-0 z-[95] overflow-y-auto p-3 sm:p-6 md:p-10 flex items-center justify-center opacity-0 scale-95 transition-all duration-200 pointer-events-none">

    <!-- Modal Box Container -->
    <div class="relative w-full max-w-2xl bg-zinc-950/95 border border-white/[0.1] rounded-3xl shadow-[inset_0_1px_0_0_rgba(255,255,255,0.08),0_25px_50px_-12px_rgba(0,0,0,0.85)] overflow-hidden pointer-events-auto my-auto">
        
        <!-- Ambient Backdrop Banner (16:9 / 21:9 Aspect Hero Artwork) -->
        <div class="relative w-full h-44 sm:h-56 bg-zinc-900 overflow-hidden">
            <img id="quick-peek-backdrop-img"
                 src=""
                 alt=""
                 class="w-full h-full object-cover object-top opacity-50 transform-gpu filter blur-[1px] scale-105 transition-all duration-500">
            <!-- Gradient Vignette overlay to seamlessly merge into bottom dark surface -->
            <div class="absolute inset-0 bg-gradient-to-t from-zinc-950 via-zinc-950/50 to-transparent"></div>
            <div class="absolute inset-0 bg-gradient-to-r from-zinc-950/80 via-transparent to-zinc-950/80"></div>

            <!-- Top Header Action Row (Close button & Keyboard shortcut indicator) -->
            <div class="absolute top-3 right-3 sm:top-4 sm:right-4 z-20 flex items-center gap-2">
                <span class="hidden sm:inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-black/70 backdrop-blur-md text-[10px] font-mono text-zinc-400 border border-white/10 shadow">
                    <span>Press</span>
                    <kbd class="text-zinc-200 font-bold">Esc</kbd>
                    <span>to close</span>
                </span>
                <button type="button"
                        onclick="closeQuickPeekModal()"
                        aria-label="Close Quick Peek"
                        class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-black/70 hover:bg-zinc-800 backdrop-blur-md border border-white/10 text-zinc-400 hover:text-white flex items-center justify-center transition active:scale-95 shadow-lg">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Overlapping Header Information Frame -->
        <div class="relative px-4 sm:px-6 -mt-20 sm:-mt-24 z-10 flex gap-4 sm:gap-5 items-end">
            <!-- Floating 2:3 Poster Frame -->
            <div class="w-24 sm:w-32 md:w-36 aspect-[2/3] rounded-2xl overflow-hidden bg-zinc-900 ring-2 ring-white/15 shadow-2xl shrink-0 relative card-surface-specular">
                <img id="quick-peek-poster" src="" alt="" class="w-full h-full object-cover hidden">
                <div id="quick-peek-poster-fallback" class="w-full h-full flex items-center justify-center text-[10px] font-bold text-zinc-500 p-2 text-center"></div>
            </div>

            <!-- Title & Metadata Badges -->
            <div class="min-w-0 flex-1 pb-1 sm:pb-2">
                <div class="flex flex-wrap items-center gap-1.5 sm:gap-2 mb-1.5">
                    <span id="quick-peek-media-type" class="text-[10px] font-mono uppercase tracking-wider px-2 py-0.5 rounded-full bg-brand-500/15 text-brand-400 border border-brand-500/30 font-semibold">Movie</span>
                    <span id="quick-peek-year" class="text-[11px] font-mono text-zinc-400 font-semibold">2024</span>
                    <span class="text-zinc-600">•</span>
                    <span id="quick-peek-age-rating" class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-zinc-900 text-zinc-300 border border-white/10">PG-13</span>
                    <span class="text-zinc-600">•</span>
                    <span id="quick-peek-rating" class="text-[11px] font-mono text-yellow-400 font-bold">★ 8.2</span>
                </div>
                <h3 id="quick-peek-title" class="text-base sm:text-xl md:text-2xl font-black text-white tracking-tight leading-snug line-clamp-2"></h3>
            </div>
        </div>

        <!-- Body & Synopsis Area -->
        <div class="px-4 sm:px-6 pt-4 pb-5 space-y-4">
            <!-- Synopsis Description -->
            <div>
                <h4 class="text-[11px] font-mono uppercase tracking-wider text-zinc-400 mb-1 font-semibold">Storyline &amp; Overview</h4>
                <p id="quick-peek-overview" class="text-xs sm:text-sm text-zinc-300 leading-relaxed max-h-28 sm:max-h-36 overflow-y-auto pr-1 scrollbar-thin scrollbar-thumb-zinc-800 scrollbar-track-transparent">
                    Loading overview...
                </p>
            </div>

            <!-- Primary CTAs Action Row -->
            <div class="pt-2 flex flex-wrap items-center gap-2.5 sm:gap-3">
                <!-- Play Now (Primary Focus) -->
                <a id="quick-peek-watch-btn"
                   href="#"
                   class="flex-1 sm:flex-none min-h-[44px] px-5 sm:px-6 py-2.5 rounded-2xl bg-brand-500 hover:bg-brand-600 text-white font-bold text-xs sm:text-sm flex items-center justify-center gap-2 shadow-lg shadow-brand-500/25 active:scale-[0.98] transition">
                    <svg class="w-4 h-4 fill-white translate-x-0.5" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    <span>Stream Now</span>
                </a>

                <!-- Official Trailer Modal Trigger -->
                <button id="quick-peek-trailer-btn"
                        type="button"
                        class="min-h-[44px] px-4 py-2.5 rounded-2xl bg-zinc-900 hover:bg-zinc-800 text-zinc-200 border border-white/10 font-semibold text-xs sm:text-sm flex items-center gap-2 active:scale-[0.98] transition">
                    <svg class="w-4 h-4 text-brand-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span>Trailer</span>
                </button>

                <!-- Full Detail View Link -->
                <a id="quick-peek-detail-btn"
                   href="#"
                   class="min-h-[44px] px-4 py-2.5 rounded-2xl bg-zinc-900 hover:bg-zinc-800 text-zinc-300 hover:text-white border border-white/10 font-semibold text-xs sm:text-sm flex items-center gap-2 active:scale-[0.98] transition">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span>Full Details</span>
                </a>
            </div>
        </div>

        <!-- Bottom Keyboard HUD Bar -->
        <div class="px-4 sm:px-6 py-2.5 bg-zinc-900/60 border-t border-white/[0.06] flex items-center justify-between text-[11px] text-zinc-400 font-mono">
            <span class="flex items-center gap-2">
                <span class="w-1.5 h-1.5 rounded-full bg-brand-500"></span>
                <span>Spacebar Quick Peek Engine</span>
            </span>
            <div class="hidden sm:flex items-center gap-3">
                <span><kbd class="px-1.5 py-0.5 rounded bg-zinc-950 border border-white/10 text-zinc-300">Enter</kbd> to Stream</span>
                <span><kbd class="px-1.5 py-0.5 rounded bg-zinc-950 border border-white/10 text-zinc-300">Space</kbd> / <kbd class="px-1.5 py-0.5 rounded bg-zinc-950 border border-white/10 text-zinc-300">Esc</kbd> to Close</span>
            </div>
        </div>
    </div>
</div>
