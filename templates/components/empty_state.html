<div class="py-16 px-4 text-center max-w-md mx-auto flex flex-col items-center justify-center">
    <div class="w-16 h-16 rounded-full bg-gray-900 border border-gray-800 flex items-center justify-center text-gray-500 mb-4 shadow-xl">
        {% if icon == 'watchlist' %}
        <svg class="w-8 h-8 text-brand-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
        </svg>
        {% elif icon == 'search' %}
        <svg class="w-8 h-8 text-brand-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        {% else %}
        <svg class="w-8 h-8 text-brand-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z" />
        </svg>
        {% endif %}
    </div>
    <h3 class="text-lg sm:text-xl font-black text-white">{{ title|default:"Nothing Found" }}</h3>
    <p class="text-xs sm:text-sm text-gray-400 mt-1.5 leading-relaxed">
        {{ message|default:"There is no content available in this section yet." }}
    </p>
    {% if cta_url %}
    <a href="{{ cta_url }}" class="mt-5 inline-flex items-center gap-2 bg-brand-500 hover:bg-red-600 text-white font-bold text-xs sm:text-sm px-6 py-2.5 rounded-full transition shadow-lg shadow-brand-500/25 hover:scale-105 active:scale-95">
        <span>{{ cta_text|default:"Browse Catalog" }}</span>
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
    </a>
    {% endif %}
</div>
