<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <!-- Sky & Atmosphere Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090514"/>
      <stop offset="25%" stop-color="#1f0e38"/>
      <stop offset="50%" stop-color="#4c1d68"/>
      <stop offset="70%" stop-color="#db2777"/>
      <stop offset="85%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1"/>
      <stop offset="35%" stop-color="#f59e0b" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#ec4899" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="20%" stop-color="#ec4899"/>
      <stop offset="55%" stop-color="#311042"/>
      <stop offset="100%" stop-color="#06020c"/>
    </linearGradient>

    <!-- VI Roman Numeral Neon Gradient -->
    <linearGradient id="viGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="30%" stop-color="#ec4899"/>
      <stop offset="70%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="textChrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="heavyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="600" height="900" fill="url(#skyGrad)"/>

  <!-- Giant Retro Vice City Sun -->
  <circle cx="300" cy="540" r="160" fill="url(#sunGlow)"/>
  <circle cx="300" cy="540" r="110" fill="#fef08a" opacity="0.9"/>

  <!-- Sun Horizontal Blinds Effect -->
  <g fill="#4c1d68" opacity="0.35">
    <rect x="180" y="520" width="240" height="4" rx="2"/>
    <rect x="190" y="534" width="220" height="6" rx="3"/>
    <rect x="205" y="550" width="190" height="8" rx="4"/>
    <rect x="225" y="568" width="150" height="10" rx="5"/>
    <rect x="245" y="588" width="110" height="12" rx="6"/>
  </g>

  <!-- Distant City Skyline Silhouettes -->
  <g fill="#180a28" opacity="0.85">
    <rect x="40" y="560" width="30" height="80"/>
    <rect x="65" y="540" width="25" height="100"/>
    <rect x="85" y="555" width="35" height="85"/>
    <rect x="115" y="525" width="20" height="115"/>
    <polygon points="125,500 123,525 127,525"/>
    <rect x="130" y="550" width="30" height="90"/>
    <rect x="420" y="545" width="30" height="95"/>
    <rect x="445" y="530" width="25" height="110"/>
    <polygon points="457,495 455,530 459,530"/>
    <rect x="465" y="550" width="40" height="90"/>
    <rect x="500" y="565" width="30" height="75"/>
    <rect x="525" y="540" width="35" height="100"/>
  </g>

  <!-- Ocean & Shore -->
  <rect x="0" y="620" width="600" height="280" fill="url(#oceanGrad)"/>
  
  <!-- Ocean Horizon Water Light Reflections -->
  <ellipse cx="300" cy="625" rx="140" ry="12" fill="#fef08a" opacity="0.6"/>
  <ellipse cx="300" cy="645" rx="180" ry="8" fill="#f97316" opacity="0.4"/>
  <ellipse cx="300" cy="670" rx="220" ry="6" fill="#ec4899" opacity="0.3"/>

  <!-- Iconic Palm Trees Silhouettes -->
  <!-- Left Majestic Palm -->
  <path d="M 0 900 Q 60 700 80 500 Q 85 420 70 340" stroke="#06020c" stroke-width="22" stroke-linecap="round" fill="none"/>
  <!-- Left Palm Fronds -->
  <g fill="#06020c">
    <path d="M 70 340 Q 140 310 200 350 Q 140 340 70 340 Z"/>
    <path d="M 70 340 Q 150 280 210 290 Q 140 300 70 340 Z"/>
    <path d="M 70 340 Q 110 230 150 210 Q 100 250 70 340 Z"/>
    <path d="M 70 340 Q 40 200 30 180 Q 40 240 70 340 Z"/>
    <path d="M 70 340 Q -10 230 -40 240 Q 0 270 70 340 Z"/>
    <path d="M 70 340 Q 10 320 -50 370 Q 10 350 70 340 Z"/>
  </g>

  <!-- Right Tall Palm -->
  <path d="M 600 900 Q 530 680 515 460 Q 510 380 530 280" stroke="#06020c" stroke-width="18" stroke-linecap="round" fill="none"/>
  <!-- Right Palm Fronds -->
  <g fill="#06020c">
    <path d="M 530 280 Q 450 240 380 270 Q 450 270 530 280 Z"/>
    <path d="M 530 280 Q 430 200 370 200 Q 440 230 530 280 Z"/>
    <path d="M 530 280 Q 480 140 440 110 Q 480 170 530 280 Z"/>
    <path d="M 530 280 Q 570 130 610 110 Q 570 180 530 280 Z"/>
    <path d="M 530 280 Q 610 220 650 240 Q 590 260 530 280 Z"/>
    <path d="M 530 280 Q 600 320 660 380 Q 580 340 530 280 Z"/>
  </g>

  <!-- Giant Glowing "VI" Logo in Upper Sky -->
  <g transform="translate(300, 310)" filter="url(#heavyGlow)">
    <text x="0" y="0" font-family="'Impact', 'Arial Black', sans-serif" font-size="210" font-weight="900" text-anchor="middle" fill="url(#viGrad)" letter-spacing="4">VI</text>
  </g>
  <g transform="translate(300, 310)">
    <text x="0" y="0" font-family="'Impact', 'Arial Black', sans-serif" font-size="210" font-weight="900" text-anchor="middle" fill="#ffffff" opacity="0.95" letter-spacing="4">VI</text>
  </g>

  <!-- Bottom Dark Shading for Text Legibility -->
  <rect x="0" y="600" width="600" height="300" fill="url(#oceanGrad)" opacity="0.92"/>
  <rect x="0" y="660" width="600" height="240" fill="#06020c" opacity="0.85"/>

  <!-- Logo Titles Header: GRAND THEFT AUTO -->
  <g transform="translate(300, 720)">
    <text x="0" y="-35" font-family="'Arial Black', 'Impact', sans-serif" font-size="24" font-weight="900" text-anchor="middle" fill="#ffffff" letter-spacing="4" filter="url(#neonGlow)">GRAND THEFT AUTO</text>
    <text x="0" y="-35" font-family="'Arial Black', 'Impact', sans-serif" font-size="24" font-weight="900" text-anchor="middle" fill="#f8fafc" letter-spacing="4">GRAND THEFT AUTO</text>
    
    <!-- Subtitle: AN EXTENDED LOOK -->
    <rect x="-170" y="-12" width="340" height="36" rx="18" fill="#db2777" fill-opacity="0.25" stroke="#ec4899" stroke-width="1.5"/>
    <text x="0" y="12" font-family="'Plus Jakarta Sans', 'Arial', sans-serif" font-size="15" font-weight="900" text-anchor="middle" fill="#38bdf8" letter-spacing="3">AN EXTENDED LOOK</text>
    
    <!-- Tagline & Details -->
    <text x="0" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#cbd5e1" letter-spacing="1">VICE CITY • LEONIDA • 2026 PREMIERE</text>
    
    <!-- 18+ Mature Badge -->
    <g transform="translate(0, 95)">
      <rect x="-24" y="-16" width="48" height="24" rx="6" fill="#dc2626" stroke="#ef4444" stroke-width="1"/>
      <text x="0" y="1" font-family="'Arial Black', sans-serif" font-size="12" font-weight="900" text-anchor="middle" fill="#ffffff">18+</text>
    </g>
  </g>
</svg>
