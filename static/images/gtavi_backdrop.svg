<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Panoramic Vice City Sky Gradient -->
    <linearGradient id="wideSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514"/>
      <stop offset="25%" stop-color="#1e0c3a"/>
      <stop offset="45%" stop-color="#4a154b"/>
      <stop offset="65%" stop-color="#db2777"/>
      <stop offset="85%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Glowing Pink & Cyan VI Numeral -->
    <linearGradient id="wideVi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="40%" stop-color="#ec4899"/>
      <stop offset="75%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <radialGradient id="panoramicSun" cx="65%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1"/>
      <stop offset="25%" stop-color="#f59e0b" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#ec4899" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="15%" stop-color="#db2777"/>
      <stop offset="45%" stop-color="#311042"/>
      <stop offset="100%" stop-color="#06020c"/>
    </linearGradient>

    <filter id="megaGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky Canvas -->
  <rect width="1920" height="1080" fill="url(#wideSky)"/>

  <!-- Giant Atmospheric Vice City Setting Sun -->
  <circle cx="1250" cy="580" r="320" fill="url(#panoramicSun)"/>
  <circle cx="1250" cy="580" r="220" fill="#fef08a" opacity="0.9"/>

  <!-- Vice City Skyscrapers & Waterfront Skyline Silhouettes -->
  <g fill="#120622" opacity="0.95">
    <rect x="700" y="520" width="60" height="180"/>
    <rect x="750" y="470" width="50" height="230"/>
    <polygon points="775,410 770,470 780,470"/>
    <rect x="810" y="500" width="70" height="200"/>
    <rect x="890" y="440" width="80" height="260"/>
    <polygon points="930,370 924,440 936,440"/>
    <rect x="980" y="480" width="55" height="220"/>
    <rect x="1045" y="430" width="90" height="270"/>
    <polygon points="1090,350 1084,430 1096,430"/>
    <rect x="1145" y="510" width="70" height="190"/>
    <rect x="1225" y="460" width="65" height="240"/>
    <rect x="1300" y="490" width="80" height="210"/>
    <rect x="1390" y="450" width="75" height="250"/>
    <polygon points="1428,390 1422,450 1434,450"/>
    <rect x="1475" y="530" width="90" height="170"/>
    <rect x="1580" y="560" width="70" height="140"/>
  </g>

  <!-- Ocean Water Base -->
  <rect x="0" y="700" width="1920" height="380" fill="url(#waterGrad)"/>

  <!-- Water Surface Neon Horizon Reflections -->
  <g opacity="0.6">
    <ellipse cx="1250" cy="710" rx="350" ry="18" fill="#fef08a"/>
    <ellipse cx="1250" cy="740" rx="420" ry="14" fill="#f97316"/>
    <ellipse cx="1250" cy="780" rx="500" ry="10" fill="#ec4899"/>
    <ellipse cx="1250" cy="830" rx="580" ry="8" fill="#a855f7"/>
  </g>

  <!-- Left Giant Foreground Palm Tree Grouping -->
  <path d="M 0 1080 Q 180 850 220 580 Q 230 460 210 320" stroke="#06020c" stroke-width="32" stroke-linecap="round" fill="none"/>
  <g fill="#06020c">
    <path d="M 210 320 Q 340 280 480 340 Q 340 330 210 320 Z"/>
    <path d="M 210 320 Q 360 210 490 230 Q 340 250 210 320 Z"/>
    <path d="M 210 320 Q 290 130 380 90 Q 270 170 210 320 Z"/>
    <path d="M 210 320 Q 140 100 110 70 Q 140 170 210 320 Z"/>
    <path d="M 210 320 Q 40 150 -10 170 Q 70 220 210 320 Z"/>
    <path d="M 210 320 Q 60 280 -60 360 Q 60 330 210 320 Z"/>
  </g>

  <!-- Secondary Palm Tree -->
  <path d="M 120 1080 Q 280 880 330 650 Q 345 540 330 420" stroke="#06020c" stroke-width="24" stroke-linecap="round" fill="none"/>
  <g fill="#06020c">
    <path d="M 330 420 Q 440 380 540 430 Q 440 420 330 420 Z"/>
    <path d="M 330 420 Q 450 320 550 330 Q 430 360 330 420 Z"/>
    <path d="M 330 420 Q 390 240 470 200 Q 370 280 330 420 Z"/>
    <path d="M 330 420 Q 260 230 230 200 Q 260 300 330 420 Z"/>
    <path d="M 330 420 Q 180 270 140 290 Q 220 340 330 420 Z"/>
  </g>

  <!-- Right Edge Palm Tree -->
  <path d="M 1920 1080 Q 1780 820 1760 550 Q 1750 430 1780 300" stroke="#06020c" stroke-width="28" stroke-linecap="round" fill="none"/>
  <g fill="#06020c">
    <path d="M 1780 300 Q 1640 260 1510 310 Q 1640 300 1780 300 Z"/>
    <path d="M 1780 300 Q 1620 180 1500 190 Q 1630 230 1780 300 Z"/>
    <path d="M 1780 300 Q 1700 100 1600 60 Q 1710 150 1780 300 Z"/>
    <path d="M 1780 300 Q 1840 80 1890 50 Q 1840 160 1780 300 Z"/>
    <path d="M 1780 300 Q 1920 220 1990 240 Q 1900 270 1780 300 Z"/>
  </g>

  <!-- Massive Cinematic "VI" in Upper Center-Right -->
  <g transform="translate(1250, 420)" filter="url(#megaGlow)">
    <text x="0" y="0" font-family="'Impact', 'Arial Black', sans-serif" font-size="340" font-weight="900" text-anchor="middle" fill="url(#wideVi)" letter-spacing="8">VI</text>
  </g>
  <g transform="translate(1250, 420)">
    <text x="0" y="0" font-family="'Impact', 'Arial Black', sans-serif" font-size="340" font-weight="900" text-anchor="middle" fill="#ffffff" opacity="0.95" letter-spacing="8">VI</text>
  </g>

  <!-- Bottom Dark Gradient Overlays for High-Contrast UI Readability -->
  <rect x="0" y="0" width="1920" height="1080" fill="black" opacity="0.25"/>
  <linearGradient id="bottomFade" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#030712" stop-opacity="0"/>
    <stop offset="50%" stop-color="#030712" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#030712" stop-opacity="0.95"/>
  </linearGradient>
  <rect x="0" y="400" width="1920" height="680" fill="url(#bottomFade)"/>
</svg>
